<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Projector Telemetry</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 25px auto;
      max-width: 850px;
      line-height: 1.5;
      color: #222;
      background: #fafafa;
      padding: 0 15px;
    }
    h1 {
      border-bottom: 2px solid #333;
      padding-bottom: 8px;
    }
    .nav {
      margin-bottom: 20px;
      padding: 10px;
      background: #eee;
      border: 1px solid #ccc;
    }
    .nav a {
      margin-right: 15px;
      text-decoration: none;
      color: #0366d6;
      font-weight: bold;
    }
    .card {
      background: #fff;
      border: 1px solid #ccc;
      padding: 20px;
      margin-bottom: 20px;
    }
    .stream-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }
    .badge {
      padding: 3px 10px;
      border-radius: 3px;
      font-weight: bold;
      color: #fff;
      font-size: 13px;
    }
    .badge-online { background: #28a745; }
    .badge-offline { background: #dc3545; }
    .question-title {
      font-size: 1.35rem;
      font-weight: bold;
      margin-bottom: 20px;
      color: #111;
    }
    .stats-row {
      display: flex;
      gap: 30px;
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      padding: 12px 16px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .stats-row strong {
      font-size: 18px;
      color: #0366d6;
    }
    .bar-row {
      margin-bottom: 16px;
    }
    .bar-label-group {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 5px;
      font-weight: 500;
    }
    .bar-track {
      height: 24px;
      background: #e9ecef;
      border: 1px solid #ced4da;
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: #0366d6;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>

  <h1>Classroom Live Telemetry</h1>

  <div class="nav">
    <a href="/index.html">Home</a>
    <a href="/create.html">Create Poll</a>
    <a href="/voter.html">Student Voter</a>
    <a href="/projector.html">Projector Screen</a>
  </div>

  <div class="card">
    <div class="stream-header">
      <span style="font-size: 14px; color: #555;">Real-Time Projector Stream</span>
      <span id="sse-badge" class="badge badge-online">SSE: Connected</span>
    </div>

    <div class="question-title" id="question-title">
      Waiting for active poll...
    </div>

    <div class="stats-row">
      <div>Total Verified Votes: <strong id="stat-total-votes">0</strong></div>
      <div>Duplicates Filtered: <strong id="stat-duplicate-attempts" style="color: #dc3545;">0</strong></div>
      <div>Broadcast Rate: <strong>100ms Micro-Batch</strong></div>
    </div>

    <div id="bars-list">
      <p style="color: #666;">No active poll loaded.</p>
    </div>
  </div>

  <script>
    const questionTitle = document.getElementById('question-title');
    const barsList = document.getElementById('bars-list');
    const statTotalVotes = document.getElementById('stat-total-votes');
    const statDuplicateAttempts = document.getElementById('stat-duplicate-attempts');
    const sseBadge = document.getElementById('sse-badge');

    const colors = {
      A: '#007bff',
      B: '#28a745',
      C: '#fd7e14',
      D: '#dc3545',
      E: '#6f42c1',
      F: '#20c997'
    };

    function initProjectorSSE() {
      const eventSource = new EventSource('/events');

      eventSource.onopen = () => {
        sseBadge.className = 'badge badge-online';
        sseBadge.textContent = 'SSE: Connected';
      };

      eventSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          handleTelemetryUpdate(data);
        } catch (e) {}
      };

      eventSource.onerror = () => {
        sseBadge.className = 'badge badge-offline';
        sseBadge.textContent = 'SSE: Reconnecting';
      };
    }

    function handleTelemetryUpdate(data) {
      if (data.type === 'NO_ACTIVE_POLL') {
        questionTitle.textContent = 'Waiting for active poll... (None currently active)';
        barsList.innerHTML = '<p style="color: #666; padding: 20px 0; text-align: center;">No active poll published yet. <a href="/create.html">Create one here</a>.</p>';
        statTotalVotes.textContent = '0';
        statDuplicateAttempts.textContent = '0';
      } else if (data.type === 'POLL_SNAPSHOT') {
        questionTitle.textContent = data.poll.question;
        renderInitialBars(data.poll.options);
        updateTally(data.poll.tally, data.poll.totalVotes, data.poll.duplicateAttempts);
      } else if (data.type === 'TALLY_UPDATE') {
        updateTally(data.tally, data.totalVotes, data.duplicateAttempts);
      }
    }

    function renderInitialBars(options) {
      barsList.innerHTML = '';
      for (const [key, label] of Object.entries(options)) {
        const row = document.createElement('div');
        row.className = 'bar-row';

        const color = colors[key] || '#007bff';

        row.innerHTML = `
          <div class="bar-label-group">
            <span><strong>${key}:</strong> <span class="opt-label"></span></span>
            <span id="stat-val-${key}" style="font-weight: bold;">0 votes (0%)</span>
          </div>
          <div class="bar-track">
            <div id="bar-fill-${key}" class="bar-fill" style="width: 0%; background: ${color};"></div>
          </div>
        `;

        row.querySelector('.opt-label').textContent = label;
        barsList.appendChild(row);
      }
    }

    function updateTally(tally, totalVotes, duplicateAttempts) {
      statTotalVotes.textContent = totalVotes;
      statDuplicateAttempts.textContent = duplicateAttempts;

      for (const [key, count] of Object.entries(tally)) {
        const percentage = totalVotes > 0 ? ((count / totalVotes) * 100).toFixed(1) : '0.0';
        const statVal = document.getElementById(`stat-val-${key}`);
        const barFill = document.getElementById(`bar-fill-${key}`);
        if (statVal && barFill) {
          statVal.textContent = `${count} votes (${percentage}%)`;
          barFill.style.width = `${percentage}%`;
        }
      }
    }

    initProjectorSSE();
  </script>

</body>
</html>
