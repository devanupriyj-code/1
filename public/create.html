<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Poll</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px auto;
      max-width: 750px;
      line-height: 1.5;
      color: #222;
      background: #fafafa;
      padding: 0 15px;
    }
    h1 {
      border-bottom: 2px solid #333;
      padding-bottom: 8px;
    }
    .nav {
      margin-bottom: 25px;
      padding: 10px;
      background: #eee;
      border: 1px solid #ccc;
    }
    .nav a {
      margin-right: 15px;
      text-decoration: none;
      color: #0366d6;
      font-weight: bold;
    }
    .card {
      background: #fff;
      border: 1px solid #ccc;
      padding: 18px;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      font-size: 14px;
      border: 1px solid #bbb;
      border-radius: 3px;
    }
    .opt-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .opt-key {
      font-weight: bold;
      width: 25px;
      text-align: center;
    }
    button {
      padding: 7px 14px;
      font-size: 14px;
      border: 1px solid #999;
      background: #eee;
      cursor: pointer;
      border-radius: 3px;
    }
    button:hover {
      background: #ddd;
    }
    .btn-submit {
      background: #28a745;
      color: #fff;
      border-color: #218838;
      font-weight: bold;
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }
    .btn-submit:hover {
      background: #218838;
    }
    .banner {
      display: none;
      padding: 10px 14px;
      margin-top: 15px;
      border-radius: 4px;
    }
    .banner-success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .banner-error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th {
      background: #eee;
    }
    .active-tag {
      background: #28a745;
      color: #fff;
      padding: 2px 7px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Create &amp; Manage Polls</h1>

  <div class="nav">
    <a href="/index.html">Home</a>
    <a href="/create.html">Create Poll</a>
    <a href="/voter.html">Student Voter</a>
    <a href="/projector.html">Projector Screen</a>
  </div>

  <div class="card">
    <h2 style="margin-top: 0;">Create New Poll</h2>
    <form id="poll-form">
      <div class="form-group">
        <label for="question-input">Poll Question:</label>
        <input type="text" id="question-input" required placeholder="Type your question here...">
      </div>

      <div class="form-group">
        <label>Options (2 to 6 choices):</label>
        <div id="options-container">
          <div class="opt-row" data-key="A">
            <span class="opt-key">A</span>
            <input type="text" class="opt-input" required placeholder="Option A description">
          </div>
          <div class="opt-row" data-key="B">
            <span class="opt-key">B</span>
            <input type="text" class="opt-input" required placeholder="Option B description">
          </div>
          <div class="opt-row" data-key="C">
            <span class="opt-key">C</span>
            <input type="text" class="opt-input" placeholder="Option C description (optional)">
            <button type="button" onclick="removeOption(this)">Remove</button>
          </div>
          <div class="opt-row" data-key="D">
            <span class="opt-key">D</span>
            <input type="text" class="opt-input" placeholder="Option D description (optional)">
            <button type="button" onclick="removeOption(this)">Remove</button>
          </div>
        </div>
        <button type="button" id="btn-add" style="margin-top: 8px;">+ Add Choice</button>
      </div>

      <button type="submit" class="btn-submit">Publish Live Poll</button>
    </form>

    <div id="banner" class="banner"></div>
  </div>

  <div class="card">
    <h2 style="margin-top: 0;">Existing Polls</h2>
    <table>
      <thead>
        <tr>
          <th style="width: 90px;">Poll ID</th>
          <th>Question</th>
          <th style="width: 70px;">Votes</th>
          <th style="width: 90px;">Action</th>
        </tr>
      </thead>
      <tbody id="polls-table">
        <tr><td colspan="4">Loading polls...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const alphabet = ['A', 'B', 'C', 'D', 'E', 'F'];
    const container = document.getElementById('options-container');
    const btnAdd = document.getElementById('btn-add');
    const form = document.getElementById('poll-form');
    const banner = document.getElementById('banner');
    const pollsTable = document.getElementById('polls-table');

    function refreshKeys() {
      const rows = container.querySelectorAll('.opt-row');
      rows.forEach((row, idx) => {
        const key = alphabet[idx];
        row.dataset.key = key;
        row.querySelector('.opt-key').textContent = key;
      });
      btnAdd.style.display = rows.length >= 6 ? 'none' : 'inline-block';
    }

    function removeOption(btn) {
      const row = btn.closest('.opt-row');
      if (container.querySelectorAll('.opt-row').length > 2) {
        row.remove();
        refreshKeys();
      }
    }

    btnAdd.addEventListener('click', () => {
      const count = container.querySelectorAll('.opt-row').length;
      if (count < 6) {
        const key = alphabet[count];
        const div = document.createElement('div');
        div.className = 'opt-row';
        div.dataset.key = key;
        div.innerHTML = `
          <span class="opt-key">${key}</span>
          <input type="text" class="opt-input" placeholder="Option ${key} description">
          <button type="button" onclick="removeOption(this)">Remove</button>
        `;
        container.appendChild(div);
        refreshKeys();
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = document.getElementById('question-input').value.trim();
      const rows = container.querySelectorAll('.opt-row');
      const options = {};

      rows.forEach(row => {
        const key = row.dataset.key;
        const val = row.querySelector('.opt-input').value.trim();
        if (val) options[key] = val;
      });

      if (Object.keys(options).length < 2) {
        showBanner('Please provide at least 2 non-empty options.', false);
        return;
      }

      try {
        const res = await fetch('/api/polls', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, options })
        });
        const data = await res.json();
        if (res.ok) {
          showBanner(`Poll created successfully (ID: ${data.poll.poll_id}).`, true);
          document.getElementById('question-input').value = '';
          loadPolls();
        } else {
          showBanner(data.error || 'Failed to create poll.', false);
        }
      } catch (err) {
        showBanner('Network error connecting to server.', false);
      }
    });

    function showBanner(msg, isSuccess) {
      banner.textContent = msg;
      banner.className = `banner ${isSuccess ? 'banner-success' : 'banner-error'}`;
      banner.style.display = 'block';
    }

    async function loadPolls() {
      try {
        const res = await fetch('/api/polls');
        const data = await res.json();
        renderPolls(data.polls, data.activePollId);
      } catch (err) {
        pollsTable.innerHTML = '<tr><td colspan="4">Error loading polls.</td></tr>';
      }
    }

    function renderPolls(polls, activeId) {
      if (!polls || polls.length === 0) {
        pollsTable.innerHTML = '<tr><td colspan="4" style="color: #777;">No polls created yet.</td></tr>';
        return;
      }
      pollsTable.innerHTML = '';
      polls.forEach(p => {
        const tr = document.createElement('tr');
        const isActive = p.poll_id === activeId;
        tr.innerHTML = `
          <td><code>${p.poll_id}</code></td>
          <td class="q-cell"></td>
          <td>${p.totalVotes}</td>
          <td>
            ${isActive 
              ? '<span class="active-tag">Active</span>' 
              : `<button type="button" onclick="activatePoll('${p.poll_id}')">Activate</button>`
            }
          </td>
        `;
        tr.querySelector('.q-cell').textContent = p.question;
        pollsTable.appendChild(tr);
      });
    }

    async function activatePoll(poll_id) {
      try {
        const res = await fetch(`/api/polls/${poll_id}/activate`, { method: 'POST' });
        if (res.ok) {
          showBanner(`Poll ${poll_id} activated!`, true);
          loadPolls();
        }
      } catch (err) {
        showBanner('Failed to activate poll.', false);
      }
    }

    loadPolls();
  </script>
</body>
</html>
