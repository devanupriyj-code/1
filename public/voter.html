<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Voter Screen</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px auto;
      max-width: 600px;
      line-height: 1.5;
      color: #222;
      background: #fafafa;
      padding: 0 15px;
    }
    h1 {
      border-bottom: 2px solid #333;
      padding-bottom: 8px;
    }
    .nav {
      margin-bottom: 20px;
      padding: 10px;
      background: #eee;
      border: 1px solid #ccc;
    }
    .nav a {
      margin-right: 15px;
      text-decoration: none;
      color: #0366d6;
      font-weight: bold;
    }
    .card {
      background: #fff;
      border: 1px solid #ccc;
      padding: 18px;
      margin-bottom: 15px;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #555;
      margin-bottom: 15px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }
    .badge {
      padding: 2px 8px;
      border-radius: 3px;
      font-weight: bold;
      color: #fff;
    }
    .badge-online { background: #28a745; }
    .badge-offline { background: #dc3545; }
    .badge-connecting { background: #ffc107; color: #222; }
    .question-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 15px;
      color: #111;
    }
    .option-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      margin-bottom: 10px;
      font-size: 15px;
      background: #fdfdfd;
      border: 1.5px solid #bbb;
      border-radius: 4px;
      cursor: pointer;
    }
    .option-btn:hover:not(:disabled) {
      background: #f0f4f8;
      border-color: #0366d6;
    }
    .option-btn.selected {
      background: #e1ecf4;
      border-color: #0366d6;
      font-weight: bold;
    }
    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }
    .verdict {
      padding: 12px;
      margin-top: 15px;
      border-radius: 4px;
      display: none;
    }
    .verdict-running {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
    }
    .verdict-success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .verdict-retry {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>

  <h1>Student Voter UI</h1>

  <div class="nav">
    <a href="/index.html">Home</a>
    <a href="/create.html">Create Poll</a>
    <a href="/voter.html">Student Voter</a>
    <a href="/projector.html">Projector Screen</a>
  </div>

  <div class="card">
    <div class="status-bar">
      <span>Student ID: <strong id="voter-token-display">...</strong></span>
      <span>Connection: <span id="conn-badge" class="badge badge-connecting">Connecting</span></span>
    </div>

    <div class="question-title" id="question-text">Waiting for active poll...</div>

    <div id="options-list">
      <p style="color: #666;">No active poll loaded.</p>
    </div>

    <div id="verdict-running" class="verdict verdict-running">
      Sending vote over WebSocket...
    </div>

    <div id="verdict-success" class="verdict verdict-success">
      <h3 style="margin: 0 0 5px 0;">✔ Vote Recorded!</h3>
      <div id="ack-detail"></div>
      <div style="font-size: 12px; color: #555; margin-top: 5px;" id="ack-uuid"></div>
      <div style="font-size: 12px; color: #555;" id="ack-rtt"></div>
    </div>

    <div id="verdict-retry" class="verdict verdict-retry">
      Network delay detected. Retrying transmission...
    </div>
  </div>

  <script>
    let voterToken = localStorage.getItem('voter_token');
    if (!voterToken) {
      voterToken = 'student_' + Math.random().toString(36).substring(2, 8);
      localStorage.setItem('voter_token', voterToken);
    }
    document.getElementById('voter-token-display').textContent = voterToken;

    let currentPollId = null;
    let socket = null;
    let selectedChoice = null;
    let currentVoteId = null;
    let isVoteConfirmed = false;
    let pendingVotePayload = null;

    const ACK_TIMEOUT_MS = 1000;
    const MAX_RETRIES = 5;
    let retryTimer = null;
    let retryAttempt = 0;
    let lastTransmissionTimestamp = 0;

    const badge = document.getElementById('conn-badge');
    const questionText = document.getElementById('question-text');
    const optionsList = document.getElementById('options-list');
    const verdictRunning = document.getElementById('verdict-running');
    const verdictSuccess = document.getElementById('verdict-success');
    const verdictRetry = document.getElementById('verdict-retry');
    const ackDetail = document.getElementById('ack-detail');
    const ackUuid = document.getElementById('ack-uuid');
    const ackRtt = document.getElementById('ack-rtt');

    function uuidv4() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/`;
      socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        badge.className = 'badge badge-online';
        badge.textContent = 'Connected';
        if (pendingVotePayload && !isVoteConfirmed) {
          transmitVoteWithRetry();
        }
      };

      socket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          handleIncomingMessage(data);
        } catch (e) {}
      };

      socket.onclose = () => {
        badge.className = 'badge badge-offline';
        badge.textContent = 'Disconnected';
        setTimeout(connectWebSocket, 1500);
      };

      socket.onerror = () => {};
    }

    function handleIncomingMessage(msg) {
      if (msg.type === 'NO_ACTIVE_POLL') {
        currentPollId = null;
        questionText.textContent = 'Waiting for active poll... (None currently active)';
        optionsList.innerHTML = '<p style="color: #666;">No active poll is currently running. When the instructor creates one, it will appear here!</p>';
        hideVerdicts();
      } else if (msg.type === 'CONNECTION_READY' || msg.type === 'POLL_CHANGED') {
        currentPollId = msg.poll_id;
        questionText.textContent = msg.question;
        isVoteConfirmed = false;
        selectedChoice = null;
        currentVoteId = null;
        pendingVotePayload = null;
        clearTimeout(retryTimer);
        hideVerdicts();
        renderOptions(msg.options);
      } else if (msg.type === 'VOTE_ACK') {
        if (msg.vote_id === currentVoteId) {
          clearTimeout(retryTimer);
          const rtt = Date.now() - lastTransmissionTimestamp;
          isVoteConfirmed = true;
          pendingVotePayload = null;
          hideVerdicts();
          verdictSuccess.style.display = 'block';

          if (msg.status === 'ACK_ACCEPTED') {
            ackDetail.textContent = `Vote for Choice [${msg.choice}] safely accepted by server.`;
          } else if (msg.status === 'ACK_DUPLICATE_IGNORED') {
            ackDetail.textContent = `Idempotent ACK: Duplicate vote ignored without double counting.`;
          }
          ackUuid.textContent = `Vote UUID: ${msg.vote_id}`;
          ackRtt.textContent = `Round-Trip Latency: ${rtt} ms`;
          disableButtons();
        }
      }
    }

    function renderOptions(options) {
      optionsList.innerHTML = '';
      for (const [key, label] of Object.entries(options)) {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.type = 'button';

        const strong = document.createElement('strong');
        strong.textContent = key + ': ';
        const span = document.createElement('span');
        span.textContent = label;

        btn.append(strong, span);
        btn.addEventListener('click', () => castVote(key, btn));
        optionsList.appendChild(btn);
      }
    }

    function castVote(choice, clickedBtn) {
      if (isVoteConfirmed) return;
      selectedChoice = choice;
      currentVoteId = uuidv4();
      retryAttempt = 0;

      const buttons = optionsList.querySelectorAll('.option-btn');
      buttons.forEach(b => b.classList.remove('selected'));
      clickedBtn.classList.add('selected');
      disableButtons();

      pendingVotePayload = {
        type: 'CAST_VOTE',
        poll_id: currentPollId,
        voter_token: voterToken,
        vote_id: currentVoteId,
        choice: choice
      };

      hideVerdicts();
      verdictRunning.style.display = 'block';
      transmitVoteWithRetry();
    }

    function transmitVoteWithRetry() {
      if (isVoteConfirmed || !pendingVotePayload) return;
      lastTransmissionTimestamp = Date.now();
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify(pendingVotePayload));
      }

      clearTimeout(retryTimer);
      retryTimer = setTimeout(() => {
        if (!isVoteConfirmed && retryAttempt < MAX_RETRIES) {
          retryAttempt++;
          const backoffDelay = Math.min(3000, Math.pow(1.5, retryAttempt) * 300 + Math.floor(Math.random() * 200));
          verdictRunning.style.display = 'none';
          verdictRetry.style.display = 'block';
          verdictRetry.textContent = `Retrying attempt ${retryAttempt}/${MAX_RETRIES} in ${Math.round(backoffDelay)}ms...`;
          retryTimer = setTimeout(transmitVoteWithRetry, backoffDelay);
        }
      }, ACK_TIMEOUT_MS);
    }

    function disableButtons() {
      const buttons = optionsList.querySelectorAll('.option-btn');
      buttons.forEach(b => b.disabled = true);
    }

    function hideVerdicts() {
      verdictRunning.style.display = 'none';
      verdictSuccess.style.display = 'none';
      verdictRetry.style.display = 'none';
    }

    connectWebSocket();
  </script>

</body>
</html>
